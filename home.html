
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Logo Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">
    <!-- Logo Section -->
    <div class="flex items-center justify-center p-4 bg-gray-800">
        <img src="" alt="Site Logo" class="h-10">
    </div>

    <!-- Main Content -->
    <div class="flex p-4">
        <!-- Sidebar -->
        <div class="w-1/4 bg-gray-800 p-4 rounded-lg">
            <h2 class="text-lg font-semibold mb-4">Generate Images</h2>
            <input type="text" class="w-full p-2 bg-gray-700 rounded" placeholder="Enter prompt...">
            <button class="w-full mt-4 p-2 bg-blue-600 rounded">Generate</button>
        </div>

        <!-- Gallery -->
        <div class="w-3/4 grid grid-cols-3 gap-4 p-4">
            <div class="w-full h-40 bg-gray-700 animate-pulse rounded-lg"></div>
            <div class="w-full h-40 bg-gray-700 animate-pulse rounded-lg"></div>
            <div class="w-full h-40 bg-gray-700 animate-pulse rounded-lg"></div>
            <div class="w-full h-40 bg-gray-700 animate-pulse rounded-lg"></div>
            <div class="w-full h-40 bg-gray-700 animate-pulse rounded-lg"></div>
            <div class="w-full h-40 bg-gray-700 animate-pulse rounded-lg"></div>
        </div>
    </div>
</body>
</html>
